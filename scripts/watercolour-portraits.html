<!-- Paints the watercolour team portraits from src/assets/team/*.jpg.
  Usage: serve src/assets/team over http (e.g. `cd src/assets/team && python3 -m http.server`),
  copy this file there, open it, run `await run()` in the console, then right-click → save each
  canvas into src/assets/team/paint/<name>.png. Add a line in run() for a new team member. -->
<!doctype html><body style="margin:0;background:#f8faf8"><div id="out" style="display:flex;flex-wrap:wrap"></div>
<script>
const N = 640;
// --- value noise -------------------------------------------------------
function makeNoise(seed){const p=new Float32Array(256*256);let s=seed;for(let i=0;i<p.length;i++){s=(s*16807)%2147483647;p[i]=s/2147483647}
  const at=(x,y)=>p[((y&255)<<8)|(x&255)];
  const sm=t=>t*t*(3-2*t);
  return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=sm(x-xi),yf=sm(y-yi);
    const a=at(xi,yi),b=at(xi+1,yi),c=at(xi,yi+1),d=at(xi+1,yi+1);return a+(b-a)*xf+(c-a)*yf+(a-b-c+d)*xf*yf}}
function fbm(n,x,y,oct){let v=0,amp=.5,f=1;for(let o=0;o<oct;o++){v+=amp*n(x*f,y*f);f*=2;amp*=.5}return v/(1-Math.pow(.5,oct))}

async function load(src){const i=new Image();i.src=src;await i.decode();return i}
function px(img,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,w,h);return x.getImageData(0,0,w,h)}

function bgMask(d,w,h){ // 1 = background (green backdrop connected to the border)
  const isBg=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2];isBg[i]=(g-r>16&&g-b>-20&&Math.max(r,g,b)<165)?1:0}
  const m=new Uint8Array(w*h),st=[];
  for(let x=0;x<w;x++){st.push(x)}for(let y=0;y<h*.6;y++){st.push(y*w,y*w+w-1)}
  while(st.length){const i=st.pop();if(m[i]||!isBg[i])continue;m[i]=1;const x=i%w,y=(i/w)|0;
    if(x>0)st.push(i-1);if(x<w-1)st.push(i+1);if(y>0)st.push(i-w);if(y<h-1)st.push(i+w)}
  return m}
function blur(a,w,h,r){const o=new Float32Array(w*h),t=new Float32Array(w*h);
  for(let y=0;y<h;y++){let s=0;for(let x=-r;x<=r;x++)s+=a[y*w+Math.min(w-1,Math.max(0,x))];for(let x=0;x<w;x++){t[y*w+x]=s/(2*r+1);s+=a[y*w+Math.min(w-1,x+r+1)]-a[y*w+Math.max(0,x-r)]}}
  for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=t[Math.min(h-1,Math.max(0,y))*w+x];for(let y=0;y<h;y++){o[y*w+x]=s/(2*r+1);s+=t[Math.min(h-1,y+r+1)*w+x]-t[Math.max(0,y-r)*w+x]}}
  return o}
function kuwahara(d,w,h,r){ // painterly smoothing
  const o=new Uint8ClampedArray(d.length);
  const L=new Float32Array(w*h);for(let i=0;i<w*h;i++)L[i]=.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let best=1e9,br=0,bg=0,bb=0;
    for(const[qx,qy]of[[-1,-1],[1,-1],[-1,1],[1,1]]){let n=0,sr=0,sg=0,sb=0,sl=0,sl2=0;
      for(let j=0;j<=r;j++)for(let i=0;i<=r;i++){const xx=Math.min(w-1,Math.max(0,x+qx*i)),yy=Math.min(h-1,Math.max(0,y+qy*j)),k=yy*w+xx;
        sr+=d[k*4];sg+=d[k*4+1];sb+=d[k*4+2];sl+=L[k];sl2+=L[k]*L[k];n++}
      const v=sl2/n-(sl/n)**2;if(v<best){best=v;br=sr/n;bg=sg/n;bb=sb/n}}
    const k=(y*w+x)*4;o[k]=br;o[k+1]=bg;o[k+2]=bb;o[k+3]=255}
  return o}

async function paint(name,wash,seed){
  const img=await load(name+'.jpg');
  const small=px(img,275,275);
  const m0=bgMask(small.data,275,275);
  // figure alpha at full size, softened and roughened
  const mc=document.createElement('canvas');mc.width=mc.height=275;const mx=mc.getContext('2d');const md=mx.createImageData(275,275);
  for(let i=0;i<275*275;i++){md.data[i*4+3]=m0[i]?0:255}mx.putImageData(md,0,0);
  const big=document.createElement('canvas');big.width=big.height=N;const bx=big.getContext('2d');bx.imageSmoothingQuality='high';bx.drawImage(mc,0,0,N,N);
  const ma=bx.getImageData(0,0,N,N).data;let A=new Float32Array(N*N);for(let i=0;i<N*N;i++)A[i]=ma[i*4+3]/255;
  A=blur(A,N,N,6);
  const nz=makeNoise(seed),nz2=makeNoise(seed+7),nz3=makeNoise(seed+13);
  const src=px(img,N,N);
  const K=kuwahara(src.data,N,N,5);
  // edges of the painted image
  const L=new Float32Array(N*N);for(let i=0;i<N*N;i++)L[i]=(.3*K[i*4]+.59*K[i*4+1]+.11*K[i*4+2])/255;
  const E=new Float32Array(N*N);
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){const i=y*N+x;
    const gx=L[i-N+1]+2*L[i+1]+L[i+N+1]-L[i-N-1]-2*L[i-1]-L[i+N-1];
    const gy=L[i+N-1]+2*L[i+N]+L[i+N+1]-L[i-N-1]-2*L[i-N]-L[i-N+1];E[i]=Math.min(1,Math.hypot(gx,gy)*1.6)}
  const Eb=blur(E,N,N,1);
  const out=new ImageData(N,N);const o=out.data;
  const [wr,wg,wb]=wash;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x,k=i*4;
    const u=x/N,v=y/N;
    // figure alpha: bleed edges with noise, fade out lower body unevenly
    const edgeN=(fbm(nz,x/38,y/38,4)-.5)*.9;
    const fade=1-Math.min(1,Math.max(0,(v-(.8+(fbm(nz2,x/55,y/55,4)-.5)*.3))/.14));
    let a=Math.min(1,Math.max(0,(A[i]-.68+edgeN*.45)*3.2+.5))*fade;
    a=Math.min(1,Math.max(0,a));
    // paint colour: lift towards white (transparent washes), wet blooms, granulation
    const bloom=(fbm(nz3,x/70,y/70,3)-.5)*.16;
    const gran=1-.10*fbm(nz2,x/2.2,y/2.2,2);
    let r=K[k],g=K[k+1],b=K[k+2];if(g>r+12&&g>b-25){const n=(r+g+b)/3;const t=Math.min(1,(g-r-12)/30);r=r*(1-t)+(n+20)*t;g=g*(1-t)+(n+12)*t;b=b*(1-t)+(n+16)*t}
    const lum=(r+g+b)/3;r=lum+(r-lum)*1.12;g=lum+(g-lum)*1.12;b=lum+(b-lum)*1.12; // keep colour lively
    const lift=.2+bloom;r=r*(1-lift)+255*lift;g=g*(1-lift)+255*lift;b=b*(1-lift)+255*lift;
    // pigment pools at edges + where the wash meets paper
    const pool=1-.3*Eb[i]-.25*Math.max(0,1-Math.abs(a-.55)*3)*(a>0.05?1:0);
    r*=gran*pool;g*=gran*pool;b*=gran*pool;
    // background wash: loose blob behind head and shoulders
    const dx=(u-.5)/.42,dy=(v-.46)/.46;const blob=1-Math.hypot(dx,dy)+(fbm(nz3,x/45,y/45,4)-.5)*.7;
    let wa=Math.min(1,Math.max(0,blob*2.2))*(.38+.25*fbm(nz,x/25,y/25,3));
    const wpool=Math.max(0,1-Math.abs(blob)*9)*.25; wa=Math.min(.85,wa+wpool*(blob>-.05?1:0));
    // composite: wash under figure, both on transparent paper
    const bn=(fbm(nz3,x/30,y/30,3)-.5)*.06;
    const border=Math.min(1,Math.max(0,(Math.min(u,1-u,v)-.015+bn)/.07));
    a*=border;wa*=border;
    const fa=a, ta=fa+wa*(1-fa);
    if(ta<=0.002){o[k+3]=0;continue}
    o[k]=(r*fa+wr*wa*(1-fa))/ta;o[k+1]=(g*fa+wg*wa*(1-fa))/ta;o[k+2]=(b*fa+wb*wa*(1-fa))/ta;o[k+3]=ta*255}
  const c=document.createElement('canvas');c.width=c.height=N;c.getContext('2d').putImageData(out,0,0);
  c.style.width='300px';c.id=name;document.getElementById('out').append(c);
  return c.toDataURL('image/png')}
window.run=async()=>{const r={};
  r.brian=await paint('brian',[127,163,156],11);
  r.helio=await paint('helio',[230,190,120],23);
  r.greg=await paint('greg',[140,175,205],37);
  r.nicole=await paint('nicole',[232,160,168],51);
  return r};
</script></body>
