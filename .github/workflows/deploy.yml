name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Pick up new sermons: Sunday afternoon/evening (after uploads) plus a daily catch-all. Times are UTC.
    - cron: '0 18,21 * * 0'
    - cron: '0 1 * * 0'
    - cron: '0 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Preview lives under a sub-path. When going live on villagechurch.ca, set the repo
      # variables SITE_URL=https://villagechurch.ca and BASE_PATH=/ (and CUSTOM_DOMAIN).
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://geoffreychan.com' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/villagechurch' }}
      - if: ${{ vars.CUSTOM_DOMAIN }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
